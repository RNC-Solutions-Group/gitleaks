- id: gitleaks
  name: Detect hardcoded secrets
  description: Detect hardcoded secrets using Gitleaks
  entry: gitleaks git --pre-commit --redact --staged --verbose
  language: golang
  pass_filenames: false
- id: gitleaks-docker
  name: Detect hardcoded secrets
  description: Detect hardcoded secrets using Gitleaks
  entry: ghcr.io/rnc-solutions-group/gitleaks git --pre-commit --redact --staged --verbose
  language: docker_image
  pass_filenames: false
- id: gitleaks-system
  name: Detect hardcoded secrets
  description: Detect hardcoded secrets using Gitleaks
  entry: gitleaks git --pre-commit --redact --staged --verbose
  language: system
  pass_filenames: false
- id: gitleaks-files
  name: Detect hardcoded secrets in explicit files
  description: Scan only the files forwarded by pre-commit --files/--all-files
  entry: gitleaks files --redact --verbose
  language: golang
  pass_filenames: true
- id: gitleaks-files-system
  name: Detect hardcoded secrets in explicit files
  description: Scan only the files forwarded by pre-commit --files/--all-files
  entry: gitleaks files --redact --verbose
  language: system
  pass_filenames: true
