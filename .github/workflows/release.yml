name: Publish RNC-Mod container image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rnc-solutions-group/gitleaks

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate RNC release tag and protected ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rnc\.[1-9][0-9]*$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH-rnc.N: $tag" >&2
            exit 1
          }
          base="${tag#v}"
          base="${base%%-rnc.*}"
          minimum="$(sed -n 's/^minVersion = "v\([0-9][0-9.]*\)"/\1/p' config/gitleaks.toml | head -n 1)"
          if [[ -z "$minimum" ]]; then
            echo "could not determine minimum configuration version" >&2
            exit 1
          fi
          if [[ "$base" == "$minimum" ]] || [[ "$(printf '%s\n%s\n' "$base" "$minimum" | sort -V | head -n 1)" != "$minimum" ]]; then
            echo "release base $base must be strictly newer than config minVersion $minimum" >&2
            exit 1
          fi
          git fetch --no-tags origin rnc-mod:refs/remotes/origin/rnc-mod
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/rnc-mod || {
            echo "release commit $GITHUB_SHA is not reachable from protected rnc-mod" >&2
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for RNC image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push RNC image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
